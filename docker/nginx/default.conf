server {
    listen 80;
    server_name _;

    root /var/www/sandbox/public;
    index index.php;

    charset utf-8;
    client_max_body_size 32M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # The framework's published assets carry a ?v= derived from the file, so a
    # rebuild produces a new URL and the old one can be cached indefinitely.
    #
    # Without an explicit Cache-Control, browsers apply heuristic freshness —
    # they guess a lifetime from Last-Modified and serve the stale copy without
    # revalidating, which is the "only updates on a hard reload" bug. Saying so
    # explicitly is better than leaving it to a guess, in either direction.
    location ^~ /vendor/isproject/ {
        # One header, not nginx's `expires` as well: that adds a second
        # Cache-Control of its own and the pair has to be read together.
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;
        fastcgi_read_timeout 120;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
