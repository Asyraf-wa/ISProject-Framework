# Development environment for the isproject/framework package.
#
# The repository is mounted at /var/www. The Laravel application the package is
# developed against lives in ./sandbox (git-ignored) and is linked back to the
# package with a Composer path repository, so an edit in src/ or stubs/ is live
# in the app immediately — no re-publishing, no cache clearing.
#
#   cp .env.example .env
#   docker compose up -d --build
#   docker compose exec app bash /var/www/docker/bin/init-sandbox.sh --demo
#   open http://localhost:${APP_PORT:-8080}
#
# Afterwards, run artisan through the ./dev wrapper (./dev.ps1 on Windows):
#
#   ./dev isproject:crud Product

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: isproject/php:8.4
    # /var/www, not /var/www/sandbox: the sandbox does not exist on a
    # fresh clone, and Docker would create it root-owned inside the bind mount.
    working_dir: /var/www
    volumes:
      - .:/var/www
      - composer-cache:/home/dev/.composer/cache
    environment:
      COMPOSER_MEMORY_LIMIT: -1
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-isproject}
      DB_USERNAME: ${DB_USERNAME:-isproject}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  db:
    # caching_sha2_password is the default in 8.4; the old
    # --default-authentication-plugin flag was removed in that release.
    image: mysql:8.4
    ports:
      - "${DB_PORT:-3307}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-isproject}
      MYSQL_USER: ${DB_USERNAME:-isproject}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_ROOT_HOST: "%"
    volumes:
      - db-data:/var/lib/mysql
      # Creates the separate isproject_testing schema on first boot, so the
      # test suite never wipes the data developers have been clicking through.
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Database GUI at http://localhost:8081
  #
  # Signed in automatically as the application user, which can see both
  # `isproject` and `isproject_testing`. To sign in as someone else — root, to
  # manage users or create databases — comment out PMA_USER and PMA_PASSWORD
  # and you get the normal login form (root password: DB_ROOT_PASSWORD).
  phpmyadmin:
    image: phpmyadmin:5.2-apache
    ports:
      - "${PHPMYADMIN_PORT:-8081}:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: ${DB_USERNAME:-isproject}
      PMA_PASSWORD: ${DB_PASSWORD:-secret}
      # Room to import a class-sized SQL dump without editing php.ini.
      UPLOAD_LIMIT: 256M
      MEMORY_LIMIT: 512M
      MAX_EXECUTION_TIME: 600
    depends_on:
      db:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6380}:6379"

  # Catches every mail the app sends. UI at http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_PORT:-8025}:8025"

  # Vite dev server. Opt in once the sandbox has a package.json:
  #   docker compose --profile assets up -d
  node:
    image: node:22-alpine
    profiles: ["assets"]
    working_dir: /var/www
    command: sh -c "cd sandbox && npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "${VITE_PORT:-5173}:5173"
    volumes:
      - .:/var/www

volumes:
  db-data:
  composer-cache:
