name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      # One failing combination should not hide the state of the others.
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        testbench: ['^10.0', '^11.0']
        include:
          - testbench: '^10.0'
            laravel: 'Laravel 12'
          - testbench: '^11.0'
            laravel: 'Laravel 13'

    name: PHP ${{ matrix.php }} · ${{ matrix.laravel }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # gd is not optional: the avatar and app-icon tests build real images
          # with UploadedFile::fake()->image(), which needs it. sqlite is what
          # the suite runs against — there is no database service to start.
          extensions: mbstring, gd, pdo_sqlite, sqlite3, fileinfo
          coverage: none

      - name: Install dependencies
        run: |
          composer require --dev "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --prefer-dist --prefer-stable --no-interaction --no-progress

      - name: Run the test suite
        run: vendor/bin/phpunit

  style:
    runs-on: ubuntu-latest
    name: Pint

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Check code style
        run: vendor/bin/pint --test

  assets:
    runs-on: ubuntu-latest
    name: Built assets are current

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # resources/dist is committed so the package runs without npm. That only
      # holds if it is actually rebuilt when the source changes, so rebuild it
      # here and fail if the result differs from what was pushed.
      - name: Rebuild and compare
        run: |
          npm ci
          npm run build
          git diff --exit-code -- resources/dist \
            || (echo "::error::resources/dist is stale — run 'npm run build' and commit the result." && exit 1)
